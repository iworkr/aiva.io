# Shopify App Configuration
# This file configures your Shopify app for the App Store
# Docs: https://shopify.dev/docs/apps/tools/cli/configuration

name = "Aiva: AI Inbox Assistant"
client_id = "729af1a9f3307682602bd761fcc3eefb"
application_url = "https://www.tryaiva.io/api/shopify/app"
embedded = true

[access_scopes]
# Scopes your app needs - keep minimal for faster approval
scopes = "read_customers,write_customers,read_orders,read_products,read_content"

[auth]
redirect_urls = [
  "https://www.tryaiva.io/api/shopify/auth/callback",
  "http://localhost:3000/api/shopify/auth/callback"
]

[webhooks]
api_version = "2024-10"

# App lifecycle webhooks
[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "https://www.tryaiva.io/api/shopify/webhooks"

# Billing/subscription webhooks
[[webhooks.subscriptions]]
topics = ["app_subscriptions/update"]
uri = "https://www.tryaiva.io/api/shopify/webhooks"

# MANDATORY: GDPR/Privacy compliance webhooks (uses compliance_topics, not topics)
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://www.tryaiva.io/api/shopify/webhooks"

# Order update webhooks for real-time order status tracking
[[webhooks.subscriptions]]
topics = [
  "orders/updated",
  "orders/paid",
  "orders/fulfilled",
  "orders/partially_fulfilled",
  "orders/cancelled",
  "refunds/create"
]
uri = "https://www.tryaiva.io/api/shopify/webhooks"

[pos]
embedded = false

# Note: Shopify deprecated static sidebar navigation in 2024
# Navigation is now handled via App Bridge in the app's header UI

[build]
dev_store_url = "aivateststore.myshopify.com"
