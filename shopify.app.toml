# Shopify App Configuration
# This file configures your Shopify app for the App Store
# Docs: https://shopify.dev/docs/apps/tools/cli/configuration

name = "Aiva - AI Communication Assistant"
client_id = "729af1a9f3307682602bd761fcc3eefb"

[access_scopes]
# Scopes your app needs - keep minimal for faster approval
scopes = "read_customers,write_customers,read_orders,read_products,read_content"

[auth]
redirect_urls = [
  "https://www.tryaiva.io/api/shopify/auth/callback",
  "http://localhost:3000/api/shopify/auth/callback"  # For local development
]

[webhooks]
api_version = "2024-01"

# Mandatory GDPR compliance webhooks
[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/api/shopify/webhooks"

[[webhooks.subscriptions]]
topics = ["customers/data_request"]
uri = "/api/shopify/webhooks"

[[webhooks.subscriptions]]
topics = ["customers/redact"]
uri = "/api/shopify/webhooks"

[[webhooks.subscriptions]]
topics = ["shop/redact"]
uri = "/api/shopify/webhooks"

[app_proxy]
# Optional: If you want to embed content in the storefront
# url = "https://www.tryaiva.io"
# subpath = "aiva"
# prefix = "apps"

[pos]
embedded = false

[build]
# Include any build commands here
dev_store_url = "your-dev-store.myshopify.com"  # For testing

[app]
embedded = false  # Set to true if you want app to load inside Shopify Admin

